esphome:
  name: m5stackcore2
  friendly_name: m5stack core2
  platformio_options:
    upload_speed: 460800

esp32:
  board: m5stack-core2
  framework:
    type: arduino
 
psram:
  mode: quad
  speed: 80MHz
 
wifi:
  # change to your own SSID if it's not saved in secret.yaml
  ssid: !secret wifi_ssid
  # change to your password if it's not saved in secret.yaml
  password: !secret wifi_password
  ap:
    ssid: "m5stack core2 Fallback"
    password: "somepassword"
 
captive_portal:
web_server:
  port: 80
 
logger:
  level: INFO
 
# Enable Home Assistant API 
api:
  encryption:
    key: !secret api_encryption_key
 
ota:
  platform: esphome
  # change to your password if it's not saved in secret.yaml
  #password: !secret wifi_password
 
switch:
  - platform: restart
    name: "m5stack core2 Restart"
  - platform: template
    name: "M5Stack Core2 Vibration"
    id: m5_vibration
    icon: "mdi:vibrate"
    turn_on_action:
      - lambda: |-
          // 1. Set LDO3 voltage to 3.0V (Register 0x28 = 0xCC)
          uint8_t volt_cmd[2] = {0x28, 0xCC};
          id(bus_a).write(0x34, volt_cmd, 2);

          // 2. Read register 0x12 and set ONLY bit 3 (0x08) for LDO3, preserving screen power (LDO2)
          uint8_t reg12 = 0x12;
          uint8_t val = 0;
          if (id(bus_a).write_readv(0x34, &reg12, 1, &val, 1) == esphome::i2c::ERROR_OK) {
            uint8_t on_cmd[2] = {0x12, static_cast<uint8_t>(val | 0x08)};
            id(bus_a).write(0x34, on_cmd, 2);
          }
      - delay: 250ms
      - switch.turn_off: m5_vibration
    turn_off_action:
      - lambda: |-
          // Read register 0x12 and clear ONLY bit 3 (~0x08) to stop the vibration motor
          uint8_t reg12 = 0x12;
          uint8_t val = 0;
          if (id(bus_a).write_readv(0x34, &reg12, 1, &val, 1) == esphome::i2c::ERROR_OK) {
            uint8_t off_cmd[2] = {0x12, static_cast<uint8_t>(val & ~0x08)};
            id(bus_a).write(0x34, off_cmd, 2);
          }
 
external_components:
  - source: github://martydingo/esphome-axp192
    components: [axp192]

# Define the I2S audio bus mapping for the Core2 v1.3 speaker (NS4168 amplifier)
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO0
    i2s_bclk_pin: GPIO12

# Speaker configuration using an external DAC type
speaker:
  - platform: i2s_audio
    id: m5_speaker
    dac_type: external
    i2s_dout_pin: GPIO2
    channel: mono
    i2s_mode: primary

# Media player wrapper so you can stream audio / TTS from Home Assistant
media_player:
  - platform: speaker
    id: m5_media_player
    name: "M5Stack Core2 Speaker"
    announcement_pipeline:
      speaker: m5_speaker
      format: FLAC
    
number:
  - platform: template
    name: "Brightness"
    id: core2_brightness
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 75
    set_action:
      - lambda: |-
          id(axp).set_brightness(x / 100.0f);
    
sensor:
  - platform: wifi_signal
    name: m5stack core2 Signal
    update_interval: 60s
  - platform: axp192
    id: axp
    model: M5CORE2
    address: 0x34
    i2c_id: bus_a
    update_interval: 5s
    brightness: 75%
    battery_level:
      name: "m5stack core2 Battery Level"
      id: "m5stack_core2_battery_level"
  - platform: template
    name: "M5Core2 Real Battery Voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      uint8_t reg = 0x78;
      uint8_t buf[2] = {0, 0};
      if (id(bus_a).write_readv(0x34, &reg, 1, buf, 2) == esphome::i2c::ERROR_OK) {
        uint16_t raw = (buf[0] << 4) | (buf[1] & 0x0F);
        return raw * 0.0011f;  // 1.1mV per LSB
      }
      return NAN;
  - platform: template
    name: "M5Core2 Battery Charge Current"
    unit_of_measurement: "mA"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      uint8_t reg = 0x7A;
      uint8_t buf[2] = {0, 0};
      if (id(bus_a).write_readv(0x34, &reg, 1, buf, 2) == esphome::i2c::ERROR_OK) {
        uint16_t raw = (buf[0] << 5) | (buf[1] & 0x1F);
        return raw * 0.5f;  // 0.5mA per LSB
      }
      return NAN;
  - platform: bmi270
    name: BMI270 Temperature Sensor
    id: sensor_bmi270_1
    filters: 
      - throttle_average: 10s
  - platform: template
    name: "Current Display Page"
    id: current_page_sensor
    accuracy_decimals: 0
  - platform: motion
    type: acceleration_x
    name: "BMI270 Accel X"
    filters: 
      - throttle_average: 1s
  - platform: motion
    type: acceleration_y
    name: "BMI270 Accel Y"
    filters: 
      - throttle_average: 1s
  - platform: motion
    type: acceleration_z
    name: "BMI270 Accel Z"
    filters: 
      - throttle_average: 1s
  - platform: motion
    type: gyroscope_x
    name: "BMI270 Gyro X"
    filters: 
      - throttle_average: 1s
  - platform: motion
    type: gyroscope_y
    name: "BMI270 Gyro Y"
    filters: 
      - throttle_average: 1s
  - platform: motion
    type: gyroscope_z
    name: "BMI270 Gyro Z"
    filters: 
      - throttle_average: 1s
  - platform: motion
    type: roll
    name: "BMI270 Roll"
    filters: 
      - throttle_average: 1s
  - platform: template
    name: "Touch X"
    id: touch_x_coordinate
    unit_of_measurement: "px"
    accuracy_decimals: 0
  - platform: template
    name: "Touch Y"
    id: touch_y_coordinate
    unit_of_measurement: "px"
    accuracy_decimals: 0
 
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO38
 
i2c:
  - id: bus_a
    sda: GPIO21
    scl: GPIO22
    scan: true
 
touchscreen:
  - platform: ft63x6
    id: core2_touch
    i2c_id: bus_a
    interrupt_pin: GPIO39
    on_touch:
      - lambda: |-
          id(touch_x_coordinate).publish_state(touch.x);
          id(touch_y_coordinate).publish_state(touch.y);
 
binary_sensor:
  - platform: template
    name: "M5Core2 Battery Charging"
    device_class: battery_charging
    lambda: |-
      uint8_t reg0 = 0x00;
      uint8_t reg1 = 0x01;
      uint8_t pwr_status = 0;
      uint8_t chg_status = 0;

      bool ok0 = (id(bus_a).write_readv(0x34, &reg0, 1, &pwr_status, 1) == esphome::i2c::ERROR_OK);
      bool ok1 = (id(bus_a).write_readv(0x34, &reg1, 1, &chg_status, 1) == esphome::i2c::ERROR_OK);

      if (ok0 && ok1) {
        bool external_power = (pwr_status & 0xA0) != 0;
        bool charging_bit = (chg_status & 0x40) != 0;
        return external_power && charging_bit;
      }
      return false;
  - platform: touchscreen
    name: Button A
    x_min: 10
    x_max: 120
    y_min: 240
    y_max: 280
    use_raw: true
  - platform: touchscreen
    name: Button B
    x_min: 130
    x_max: 200
    y_min: 240
    y_max: 280
    use_raw: true
  - platform: touchscreen
    name: Button C
    x_min: 230
    x_max: 310
    y_min: 240
    y_max: 280
    use_raw: true
    
text_sensor:
  - platform: version
    name: m5stack core2 ESPHome Version
  - platform: uptime
    name: uptime
  - platform: wifi_info
    ip_address:
      name: m5stack core2 IP
    ssid:
      name: m5stack core2 SSID
    bssid:
      name: m5stack core2 BSSID

globals:
  - id: display_page
    type: int
    restore_value: true
    initial_value: '0'
  - id: page_refresh_default_s
    type: int
    restore_value: true
    initial_value: '600'
  - id: page_refresh_current_s
    type: int
    restore_value: false
    initial_value: '60'
  - id: initial_sensor_sync_pending
    type: bool
    restore_value: false
    initial_value: 'true'
  - id: last_page_switch_time
    type: uint32_t
    restore_value: false
    initial_value: '0'

http_request:
  verify_ssl: false
  timeout: 20s
  buffer_size_rx: 4096

time:
  - platform: homeassistant
    id: ha_time

button:
  - platform: template
    name: "Next Page"
    on_press:
      then:
        - script.execute:
            id: change_page_to
            target_page: !lambda 'return id(display_page) + 1;'
  - platform: template
    name: "Previous Page"
    on_press:
      then:
        - script.execute:
            id: change_page_to
            target_page: !lambda 'return id(display_page) - 1;'
  - platform: template
    name: "Refresh Display"
    on_press:
      then:
        - component.update: my_display
  - platform: template
    name: "Go to Page 1"
    on_press:
      then:
        - script.execute:
            id: change_page_to
            target_page: 0
  - platform: template
    name: "Go to Page 2"
    on_press:
      then:
        - script.execute:
            id: change_page_to
            target_page: 1

font:
  - file:
      type: gfonts
      family: "Roboto"
      weight: 400
      italic: false
    id: font_roboto_400_20
    size: 20
    glyphsets: [GF_Latin_Kernel, GF_Latin_Core]
    ignore_missing_glyphs: true
  - file: "fonts/materialdesignicons-webfont.ttf"
    id: font_material_design_icons_400_48
    size: 48
    glyphs: ["\U000F07D0"]

script:
  - id: change_page_to
    parameters:
      target_page: int
    then:
      - lambda: |-
          int pages_count = 2;
          int target = target_page;
          while (target < 0) target += pages_count;
          target %= pages_count;

          uint32_t now = millis();
          if (now - id(last_page_switch_time) < 2000) {
            return;
          }

          if (id(display_page) != target) {
            id(last_page_switch_time) = now;
            id(display_page) = target;
            id(my_display)->update();
          }

motion:
  - platform: bmi270
    id: motion_bmi270_1

image:
  - platform: file
    file: "/config/esphome/images/_NZS2614.jpg"
    id: img_config_esphome_images_NZS2614_jpg_320x216
    type: RGB
    resize: 320x240
    dither: FLOYDSTEINBERG
  - platform: file
    file: "/config/esphome/images/segments_vertical_aligned_320x240.png"
    id: page2naclground
    type: RGB
    resize: 320x240
    dither: FLOYDSTEINBERG

display:
  - platform: mipi_spi
    id: my_display
    model: M5CORE2
    cs_pin: GPIO5
    dc_pin: GPIO15

    update_interval: 500ms
    invert_colors: true

    show_test_card: true
    color_order: BGR
    dimensions:
      height: 240
      width: 320
      
    lambda: |-
      const auto COLOR_WHITE = Color(255, 255, 255);
      const auto COLOR_BLACK = Color(0, 0, 0);
      const auto COLOR_RED = Color(255, 0, 0);
      const auto COLOR_GREEN = Color(0, 255, 0);
      const auto COLOR_BLUE = Color(0, 0, 255);
      const auto COLOR_YELLOW = Color(255, 255, 0);
      const auto COLOR_ORANGE = Color(255, 165, 0);
      auto color_off = COLOR_WHITE;
      auto color_on = COLOR_BLACK;

      auto wrap_text_lines = [&](int max_w, esphome::font::Font *font, const char* text, std::vector<std::string> &lines) {
        lines.clear();
        if (!text || max_w <= 0) return;
        std::string line;
        std::string word;
        const char* p = text;
        auto commit_word = [&]() {
          if (word.empty()) return;
          std::string cand = line.empty() ? word : (line + " " + word);
          int cw = 0, cx_b = 0, cbl = 0, ch = 0;
          font->measure(cand.c_str(), &cw, &cx_b, &cbl, &ch);
          if (cw > max_w && !line.empty()) {
            lines.push_back(line);
            line = word;
          } else {
            line = cand;
          }
          word.clear();
        };
        while (*p) {
          if (*p == '\r') { p++; continue; }
          if (*p == '\n') {
            commit_word();
            lines.push_back(line);
            line.clear();
          } else if (*p == ' ' || *p == '\t') {
            commit_word();
          } else {
            word += *p;
          }
          p++;
        }
        commit_word();
        if (!line.empty()) lines.push_back(line);
      };

      int currentPage = id(display_page);
      static int last_rendered_page = -1;
      bool page_changed = (last_rendered_page != currentPage);
      if (page_changed) last_rendered_page = currentPage;

      if (currentPage == 0) {
        if (page_changed) {
          id(current_page_sensor).publish_state(1);
          it.filled_rectangle(0, 0, it.get_width(), it.get_height(), COLOR_BLACK);
        } else {
          it.fill(COLOR_BLACK);
        }
        color_off = COLOR_WHITE;
        color_on = COLOR_BLACK;
        it.printf(40, 40, id(font_roboto_400_20), color_on, TextAlign::TOP_LEFT, "Hello World");
        it.image(0, 0, id(img_config_esphome_images_NZS2614_jpg_320x216));
      }
      if (currentPage == 1) {
        if (page_changed) {
          id(current_page_sensor).publish_state(2);
          it.filled_rectangle(0, 0, it.get_width(), it.get_height(), COLOR_BLACK);
        } else {
          it.fill(COLOR_BLACK);
        }
        color_off = COLOR_WHITE;
        color_on = COLOR_BLACK;
        it.image(0, 0, id(page2naclground));
      }
    auto_clear_enabled: true
